<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Esquina del Vidrio — Ingreso del equipo</title>
<meta name="description" content="Acceso para el personal de La Esquina del Vidrio. Vista previa del ingreso al panel del equipo.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="La Esquina del Vidrio — Ingreso del equipo">
<meta property="og:description" content="Acceso solo para personal de La Esquina del Vidrio.">
<meta property="og:image" content="https://jeresosa.github.io/laesquinadelvidrio/assets/85243ea6.jpg">
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/login.js" defer></script>
</head>
<body class="p-login">
<div class="split">
<div class="visual">
<img src="../assets/85243ea6.jpg" alt="La flota de La Esquina del Vidrio">
<div class="visual-cap">
<span class="fm" style="font-size: 11px; letter-spacing: .16em; color: var(--accent)">PANEL DEL EQUIPO</span>
<p class="fd" style="margin: 6px 0 0; font-size: 44px; font-weight: 900; line-height: .92">Subí trabajos, cambiá fotos y actualizá horarios.</p>
</div>
</div>
<div class="form-side">
<form class="form" id="login-form">
<a class="llogo" href="../index.html" aria-label="Volver al sitio"><img src="../assets/logo.png" alt="La Esquina del Vidrio S.R.L."></a>
<div>
<h1 class="fd" style="margin: 8px 0 4px; font-size: 64px; font-weight: 900; line-height: .9">Ingresar</h1>
<p style="margin: 0; color: #9FB2AD">Acceso solo para personal de La Esquina del Vidrio.</p>
</div>
<div class="lfield"><label for="email">Email</label><div class="linp"><input id="email" type="email" autocomplete="username" placeholder="nombre@ejemplo.com"></div></div>
<div class="lfield">
<label for="pass">Contraseña</label>
<div class="linp">
<input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
<button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<label class="lcheck"><input type="checkbox">Mantener sesión iniciada</label>
<a href="#" style="font-size: 14px; font-weight: 600">¿Olvidaste tu contraseña?</a>
</div>
<a class="lbtn" href="panel.html">Ingresar al panel
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<p class="fm" style="margin: 0; font-size: 12px; color: #7F948F">Las cuentas nuevas las crea un administrador desde Panel › Usuarios.</p>
</form>
</div>
</div>
</body>
</html>
